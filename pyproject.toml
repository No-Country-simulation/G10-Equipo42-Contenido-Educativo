[project]
name = "nuevamente"
version = "0.1.0"
description = "Sistema de transformacion de documentacion tecnica en contenido educativo personalizado"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Jesus", email = "jesus@nuevamente.dev" },
]

dependencies = [
    "langchain>=1.2",
    "langgraph>=0.4",
    "langchain-google-genai>=4.3",
    "langchain-voyageai>=0.3",
    "langchain-community>=0.4",
    "faiss-cpu>=1.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.18",
    "oci>=2.187",
    "pypdf>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nuevamente"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
