name: Validar flujo de ramas

on:
  pull_request_target:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  validar-destino:
    name: validar-origen-${{ github.event.pull_request.base.ref }}
    runs-on: ubuntu-latest

    steps:
      - name: Comprobar origen y destino
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "::error::La rama debe pertenecer a este repositorio."
            exit 1
          fi

          if [[ "$BASE" == "main" && "$HEAD" == "develop" ]]; then
            echo "Permitido: develop -> main"
          elif [[ "$BASE" == "develop" && "$HEAD" == feature/?* ]]; then
            echo "Permitido: feature/* -> develop"
          else
            echo "::error::Solo se permite develop -> main o feature/* -> develop."
            exit 1
          fi
